# Nav2 (Humble) for nav_straight: follow a straight line, stop before the first obstacle.
#
# Only the controller part of Nav2 runs: no planner, no bt_navigator, no recoveries.
# straight_goal sends a straight path to controller_server's /follow_path action, so Nav2
# never plans around an obstacle. It stops in front of it.
#
#   controller_server (RPP)  -> cmd_vel_nav
#   velocity_smoother        -> cmd_vel_smoothed
#   collision_monitor        -> nav_cmd_vel      (slow down / emergency stop on the live cloud)
#   cmd_vel_bridge           -> /cmd_vel         (robot QoS, clamp, sensor watchdog)
#
# Frames: everything runs in odom (Fast-LIO), so slam_toolbox map corrections don't move the
# line. In odom the floor is at z = -0.35 (odom_relay puts base_link at z = 0 at startup).
#
# How the stop works: RPP projects the footprint forward along the path up to the carrot
# (lookahead_dist ahead) and aborts with "detected collision ahead" when it hits a lethal
# cell. So the stopping distance from the front edge is about lookahead_dist (±1 cell).
# The launch argument stop_distance rewrites lookahead_dist / min_ / max_lookahead_dist.

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0           # abort at once when RPP reports a collision
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0  # also ends the run if collision_monitor holds the robot
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 6.28       # heading at the end doesn't matter
    FollowPath:
      # Pure pursuit on the start line = heading hold + cross-track correction.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.10       # launch arg max_speed
      lookahead_dist: 0.50           # launch arg stop_distance (see above)
      min_lookahead_dist: 0.50
      max_lookahead_dist: 0.50
      use_velocity_scaled_lookahead_dist: false
      lookahead_time: 1.5
      transform_tolerance: 0.3       # stale odom TF -> controller error -> stop
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      # Must cover lookahead_dist at the slowest speed: steps are resolution / v seconds,
      # so 0.5 m at 0.05 m/s needs 10 s. The carrot distance caps it anyway.
      max_allowed_time_to_collision_up_to_carrot: 12.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.3
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Front edge incl. feet 0.32 m (lite3-maze footprint 0.64 m); half width 0.23 m with
      # feet + 0.07 m margin. Collision checks use this outline.
      footprint: "[[0.32, 0.30], [0.32, -0.30], [-0.32, -0.30], [-0.32, 0.30]]"
      plugins: ["voxel_layer"]
      voxel_layer:
        # Raw lidar, not /scan: /scan only covers 0.45-0.85 m above the floor and misses
        # boxes and steps. A voxel layer clears in 3D, so it REMEMBERS a low box after it
        # drops below the Mid-360's lowest ray (~0.8 m clearance for a 10 cm box). Rays to
        # things behind it pass over the box and don't erase it.
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: true
        origin_z: -0.25              # 0.10 m above the floor
        z_resolution: 0.06           # VoxelLayer allows at most 16 voxels
        z_voxels: 16                 # up to 0.71 = 1.06 m above the floor
        max_obstacle_height: 0.70
        mark_threshold: 0
        unknown_threshold: 15
        combination_method: 1
        observation_sources: lidar
        lidar:
          topic: /livox/points
          data_type: "PointCloud2"
          sensor_frame: ""             # use the cloud's frame (livox_frame)
          marking: true
          clearing: true
          min_obstacle_height: -0.25   # odom z: 0.10 m above the floor
          max_obstacle_height: 0.70    # odom z: 1.05 m above the floor. Covers table tops (~0.75 m):
                                       # the robot is ~0.5 m tall but table legs block walking under
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          expected_update_rate: 0.5    # s; costmap reports "not current" if the cloud stops
          observation_persistence: 0.0
          inf_is_valid: false
      always_send_full_costmap: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.5]   # team limits; cmd_vel_bridge clamps again
    min_velocity: [0.0, 0.0, -0.5]   # never backwards
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    # Works on the live cloud only (no memory), so it is the slow-down zone and an
    # emergency stop for things that appear suddenly. The planned stop is RPP's (above).
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "nav_cmd_vel"
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["SlowZone", "StopZone"]
    SlowZone:
      # 1.2 m beyond the front edge, ±0.30 m: half speed (0.10 -> 0.05 m/s).
      type: "polygon"
      points: [0.32, 0.30, 1.52, 0.30, 1.52, -0.30, 0.32, -0.30]
      action_type: "slowdown"
      slowdown_ratio: 0.5
      max_points: 5
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    StopZone:
      # Backstop, 0.35 m beyond the front edge: inside RPP's 0.5 m stop on purpose.
      type: "polygon"
      points: [0.32, 0.30, 0.67, 0.30, 0.67, -0.30, 0.32, -0.30]
      action_type: "stop"
      max_points: 5
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    observation_sources: ["lidar"]
    lidar:
      type: "pointcloud"
      topic: "/livox/points"
      min_height: -0.25              # base_link z: 0.10 m above the floor
      max_height: 0.70               # base_link z: 1.05 m above the floor (table tops)
      enabled: true

# First supervised room trial only. This is not a maze route.
mission:
  ros__parameters:
    use_sim_time: false
    waypoints: [0.3, 0.0, 0.0]
    waypoint_frame: initial_base
    goal_timeout_sec: 45.0
velocity_gate:
  ros__parameters:
    max_linear_m_s: 0.05
    max_angular_rad_s: 0.15
    acceleration_m_s2: 0.10
    angular_acceleration_rad_s2: 0.30

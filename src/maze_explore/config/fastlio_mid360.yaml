# Fast-LIO for the maze. lite3_launcher/config/mid360.yaml (shared lab file, not modified)
# with three changes, kept from the old stack (2026-11-19):
#   blind 0.5 -> 0.3                  in 1 m cells the robot is often < 0.5 m from a wall; with
#                                     0.5 those walls were dropped and the pose slipped in
#                                     corners. The robot's own returns end at 0.25 m.
#   filter_size_surf/map 0.5 -> 0.3   finer voxels for 0.53 m walls in 1 m cells
#   extrinsic_est_en true -> false    the IMU is inside the Mid-360: the offset is fixed
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.3
        filter_size_map: 0.3
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # Livox
            scan_line:  4
            blind: 0.3
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0        # only moves Fast-LIO's local map box (laserMapping.cpp); it does not drop far points, so it does not change the load
            extrinsic_est_en:  false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true
            tf_en: false                 # odom -> base_link comes from odom_relay

        pcd_save:
            pcd_save_en: false           # must stay off: ~128 MB/min in memory
            interval: -1

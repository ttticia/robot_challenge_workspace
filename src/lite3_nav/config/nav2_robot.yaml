# Nav2 (Humble) profile for the real Lite3 with live mapping (launch/robot_navigation.launch.py).
# No AMCL or map_server: the SLAM source provides /map and map -> odom; Fast-LIO (lite3_launcher's
# lite3_bringup) provides /odom, odom -> base_link and /scan.
# Based on origin/navigation src/archive/config/nav2_params.yaml (used on the robot): 2D obstacle
# layers on /scan only (no voxel layer), Regulated Pure Pursuit, planning through unknown space.
# Speeds capped at 0.1 m/s and 0.25 rad/s (the velocity gate clamps again).
# Nav2's final output goes to /mission/nav_cmd_vel (remapped in the launch file), never /cmd_vel.
#
# Tuned for 0.9 m corridors with ideas from maze_nav (origin/navigation 419f205,
# config/nav2_params.yaml). Footprint 0.61 x 0.40 m centred on base_link: body 0.548 x 0.370 m,
# the lab Nav2 length (0.61) and 1.5 cm a side for the feet, which stay inside the body outline
# when standing (robot_info.md 7). It was maze_nav's 0.64 x 0.46 m set 5 cm back: at a 45 deg
# heading that spans 0.78 m of a 0.9 m corridor, and in the sim (2026-11-15) the robot stopped
# diagonally at a junction with every move "collision ahead" (RPP) and three goals failed. Now
# 0.71 m at 45 deg; farthest corner 0.36 m from base_link, so turning on the spot fits anywhere
# within 9 cm of a corridor centre. Smac 2D planner keeping to the corridor centre on
# a rolling global costmap (Humble's Smac segfaulted planning from just off a growing /map);
# RPP with a short lookahead (0.25 m: corners in 0.9 m corridors) and turning on the spot from
# 0.45 rad. Its collision check stays on (sim 2026-11-15: with it off the robot clipped corners,
# tilted, and wedged within 0.2 m of a wall where Smac cannot plan and spin is blocked).
# Inflation 0.3 m / cost_scaling 6 (sim finding): lethal within 0.2 m (inscribed) of a wall,
# zero cost from 0.3 m, so a 0.9 m corridor keeps a 0.5 m wide plannable lane with a 0.3 m
# zero-cost middle. 0.45-0.55 m inflation blocked that lane.
# BackUp only as the last, short recovery (0.15 m at 0.05 m/s): the lidar is blind behind the
# body (maze_nav had none), but without it the robot could stall for good at a tight junction
# (sim 2026-11-15). The launch files set bt_navigator's trees to config/nav2_bt_short_backup.xml.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15     # maze_nav
      # Slow robot: a 180 deg turn on the spot at 0.25 rad/s alone takes 12.6 s.
      movement_time_allowance: 25.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.4
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.1
      # Short (maze_nav): pure pursuit cuts corners by about the lookahead.
      lookahead_dist: 0.25
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.3
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true        # quadruped: turn on the spot, then walk
      rotate_to_heading_angular_vel: 0.25
      rotate_to_heading_min_angle: 0.45  # turn first rather than swing into a wall (maze_nav: 0.6)
      max_angular_accel: 0.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[[0.305, 0.2], [0.305, -0.2], [-0.305, -0.2], [-0.305, 0.2]]"   # body + 1.5 cm a side
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Rolling, not sized by /map (maze_nav): the live map ends at about the start pose (lidar
      # blind behind the robot) and Humble's Smac 2D does not check that the start lies in the
      # costmap; planning from just off the map edge crashed planner_server and the lifecycle
      # manager then took all of Nav2 down. The static layer still copies /map in. Goals more
      # than 10 m (x or y) from the robot are outside this window and fail to plan.
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      transform_tolerance: 0.3
      track_unknown_space: true
      # Planner only: the circle the 0.61 x 0.40 body sweeps turning on the spot (half-diagonal
      # 0.36, true body 0.33), so plans keep the centre where it can turn (sim 2026-11-15: a
      # plan hugging a wall end at a junction left RPP no room to turn and the run stalled).
      # In a 0.9 m corridor that leaves a ~0.2 m lane on the centre line. The local costmap
      # (RPP's collision check) keeps the real rectangle.
      robot_radius: 0.35
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true   # the growing live map on /map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45       # just past robot_radius; costs fall to the corridor centre
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"   # maze_nav; was NavFn
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true            # while mapping, goals border unexplored space
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0    # keep to the corridor centre
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # backup: only the tree's last recovery, 0.15 m (see nav2_bt_short_backup.xml). drive_on_heading
    # is only the mission's start creep (start_creep_m); the behaviour tree never calls it.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.1, 0.0, 0.25]
    min_velocity: [-0.1, 0.0, -0.25]
    max_accel: [0.2, 0.0, 0.5]
    max_decel: [-0.4, 0.0, -1.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

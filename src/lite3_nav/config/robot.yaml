# Copy of lite3_mission/config/robot.yaml (main e725625) plus the lite3_nav parameters
# mission.nav2_active_timeout_sec, mission.nav2_health_check, velocity_gate.output_transient_local
# and velocity_gate.expected_input_publishers. All other values are the team's.
mission:
  ros__parameters:
    use_sim_time: false
    execution_enabled: false
    mode: waypoints
    map_topic: /map
    map_frame: map
    base_frame: base_link
    imu_topic: /imu/data
    nav_action: /navigate_to_pose
    require_imu: true
    require_velocity_gate: true
    require_nav2_active: true
    nav2_lifecycle_node: /bt_navigator
    pose_timeout_sec: 0.75
    imu_timeout_sec: 0.5
    maximum_tilt_deg: 12.0
    goal_timeout_sec: 45.0
    # Max age of the last bt_navigator "active" lifecycle reply (or Nav2 goal feedback) before disarming.
    nav2_active_timeout_sec: 3.0
    # How Nav2 liveness is judged: lifecycle (get_state ACTIVE replies only), action_server
    # (navigate_to_pose server visible), or either. Trade-off: in Nav2 Humble the action server
    # exists from on_configure, so it alone cannot tell configured from active; an inactive
    # bt_navigator then rejects our goals (counted as failed goals -> disarm). "either" keeps
    # working when get_state replies are lost on the lab network. Accepted goals with fresh
    # feedback always count as active.
    nav2_health_check: either
    frontier_clearance_m: 0.25
    frontier_standoff_m: 0.32
    minimum_frontier_size_m: 0.12
    blacklist_duration_sec: 30.0
    maximum_consecutive_failures: 3
    frontier_yaw_mode: keep_current
    # First manually armed trial: 0.5 m relative to the initial body heading.
    # These are development goals, not the competition maze route.
    waypoints: [0.5, 0.0, 0.0]
    waypoint_frame: initial_base
    map_transient_local: true
velocity_gate:
  ros__parameters:
    drive_output_enabled: false
    input_topic: /mission/nav_cmd_vel
    output_topic: /cmd_vel
    # RELIABLE + TRANSIENT_LOCAL output, lifespan = command_timeout_sec: required by the
    # Lite3 domain bridge's /cmd_vel subscription; also compatible with VOLATILE subscribers.
    output_transient_local: true
    # Distinct nodes publishing input_topic. 1 = controller only; stock Nav2 with velocity_smoother
    # and behavior_server both remapped onto input_topic gives 2 (see config/sim.yaml).
    expected_input_publishers: 1
    max_linear_m_s: 0.1
    max_angular_rad_s: 0.25
    acceleration_m_s2: 0.2
    angular_acceleration_rad_s2: 0.5
    command_timeout_sec: 0.25
    lease_timeout_sec: 0.3
observations:
  ros__parameters:
    use_sim_time: false
    map_frame: map
    input_topic: /mission/observations
    point_topic: /detections
    point_kind: target
    point_label: lab_detection
    dedup_radius_m: 0.25
    cell_grid_enabled: false
    cell_size_m: 0.8
    cell_origin_x: 0.0
    cell_origin_y: 0.0
    report_directory: ~/.ros/lite3_mission
qr:
  ros__parameters:
    image_topic: /camera/color/image_raw
    camera_info_topic: /camera/color/camera_info
    max_decode_hz: 2.0
    # Set the measured physical QR side length before enabling PnP localization.
    qr_size_m: 0.0
scene_client:
  ros__parameters:
    image_topic: /camera/color/image_raw
    client_path: ''
    server: http://192.168.10.141:8000
    group: group04
    minimum_interval_sec: 5.0
    request_timeout_sec: 20.0

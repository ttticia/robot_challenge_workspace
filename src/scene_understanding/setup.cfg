[develop]
script_dir=$base/lib/scene_understanding
[install]
install_scripts=$base/lib/scene_understanding
[tool:pytest]
# The anyio package (installed with the anthropic SDK) ships a pytest plugin
# that needs pytest >= 7; Ubuntu 22.04 has pytest 6.2, which then crashes at
# startup. These tests do not use it, so disable it.
addopts = -p no:anyio

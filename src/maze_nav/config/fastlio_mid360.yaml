# Fast-LIO for maze_nav (launch arg fastlio_config, default this file). A copy of
# lite3_launcher/config/mid360.yaml (shared lab setup, not modified) with three changes for
# 1 m maze cells, where the robot is often within 0.5 m of a wall:
#   blind 0.5 -> 0.3          points nearer than this are ignored. 0.5 threw away the nearby
#                             walls, so close to walls / in corners Fast-LIO matched a few far
#                             points and its pose slipped (2026-11-19 12:25: /odom jumped ~0.5 m
#                             in 0.5 s while the robot turned in a corner; cmd_vel_bridge
#                             SENSOR FAULT). The robot's own returns (mount, top) end at 0.25 m
#                             (bag curtain_test1, standing in the open), so 0.3 keeps them out.
#   filter_size_surf/map 0.5 -> 0.3   finer voxels: 0.45 m walls in 1 m cells were a voxel or two
#   extrinsic_est_en true -> false    the IMU is inside the Mid-360: the offset is fixed, and
#                             estimating it online is one more thing that can drift
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.3
        filter_size_map: 0.3
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # Livox
            scan_line:  4
            blind: 0.3
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true
            tf_en: false                 # odom -> base_link comes from odom_relay

        pcd_save:
            pcd_save_en: false           # must stay off: ~128 MB/min in memory
            interval: -1

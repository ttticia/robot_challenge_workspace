# Nav2 (Humble) for maze_nav: navigate a 1 m grid maze on a growing SLAM map.
#
#   maze_explorer --NavigateToPose--> bt_navigator (maze_bt.xml)
#   planner_server (Smac 2D, plans through unknown)  -> path
#   controller_server (Regulated Pure Pursuit)       -> cmd_vel_nav
#   velocity_smoother                                -> nav_cmd_vel
#   cmd_vel_bridge (robot QoS, clamp, watchdog)      -> /cmd_vel
#
# Obstacles come only from /wall_scan (walls 0.30-0.45 m above the floor). Ramps, mats and
# stairs are below that band on purpose: the robot walks over them.
#
# Maze geometry (example maze.step): 1 m cells, 0.05 m walls -> ~0.90-0.95 m clear corridor,
# 0.87 m between the stair hand rails. Footprint 0.64 x 0.46 m (Lite3 incl. moving feet,
# robot_info.md), set 5 cm behind base_link (x -0.37..0.27) -> 0.22 m each side in a corridor;
# farthest corner 0.44 m from base_link, just under the 0.45 m half width, so turning on the
# spot in a cell centre still fits, with ~1 cm to spare.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20             # ms (stock 10): each tick also sends feedback that wakes the explorer
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml and default_nav_through_poses_bt_xml are both set to
    # config/maze_bt.xml by the launch file. Humble always loads the through-poses tree too,
    # and its default one needs the BackUp server, which isn't started here.

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true            # frontier goals sit next to unknown space
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0    # stay in the corridor centre
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.2                 # was 0.3: smoothing pulled corner paths to the inner wall
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0  # slow turns on the spot count as no progress
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 6.28       # heading at a frontier doesn't matter
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.2           # short: pure pursuit cuts corners by about this much
      #                                (0.35 cut the start-cell corner on 2026-11-19 04:04;
      #                                0.25 still turned close to the inner wall, 2026-11-20)
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.25
      use_velocity_scaled_lookahead_dist: false
      lookahead_time: 1.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true    # slow down in turns
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true   # slow down close to walls
      cost_scaling_dist: 0.3         # only within 0.3 m (a 0.9 m corridor is all "near")
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0   # = local_costmap inflation cost_scaling_factor
      use_rotate_to_heading: true    # quadruped: turn on the spot, then walk
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_min_angle: 0.7    # turn on the spot above 34 deg; smaller errors are
      #                                     arcs while walking (was 0.35: stop-turn-go jerks;
      #                                     0.8 arced to the inner wall before turning, 11-20)
      #                                     round corners; = explorer pre_turn_min_angle
      #                                     (no footprint_padding: corridor turns fit by 1 cm)
      # NOT the gentle start (velocity_smoother does that, OPEN_LOOP, 0.5 rad/s^2): RPP's
      # rotate-to-heading asks for measured yaw rate + this * 0.1 s, so 0.5 = 0.05 rad/s from
      # standstill, which the Lite3 ignores -> it never turns, never walks (robot 2026-11-20
      # 07:18 bag s_maze1, sims the same: "Failed to make progress"). 2.0 = 0.2 rad/s first.
      # cmd_vel_bridge min_spin_rate 0.15 guards it too.
      max_angular_accel: 2.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.6      # s; Fast-LIO odom stalls up to ~1 s (2026-11-20)
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.27, 0.23], [0.27, -0.23], [-0.37, -0.23], [-0.37, 0.23]]"   # 5 cm back of base_link centre
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: walls
        walls:
          topic: /wall_scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: false          # no return = no information (blind sector behind)
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          # Walls within 0.6 m of base_link are never CLEARED by beams (they still mark).
          # The lidar sits ~0.50 m above the floor (base_link 0.37 standing) and the walls
          # are 0.45 m: a beam passes OVER a wall closer than ~0.37 m abeam (~0.14 m at 45 deg)
          # and hits a farther wall in the band, and raytracing then wiped the near wall
          # from the costmap just when the robot was beside it (run 2026-11-19 13:01: left
          # shoulder clipped a wall turning into a corridor). A wall seen from farther away
          # now stays while the robot is close; it clears once the robot is > 0.45 m from it.
          # 0.6 -> 0.45 on 2026-11-20: anything marked within 0.6 m was permanent, so a few
          # lidar self-returns ahead of the nose sat in the footprint after the creep and RPP /
          # Spin reported "collision" all run (01:28). 0.45 = the footprint's turning radius
          # (0.44 m). With band_high 0.45 the side walls are hit directly from ~0.3 m out, so
          # walls 0.45-0.6 m away are re-marked every scan instead of relying on no-clearing.
          raytrace_min_range: 0.45
          max_obstacle_height: 2.0
          expected_update_rate: 1.5   # s; was 0.5: odom stalls of ~1 s flagged the costmap stale (user 2026-11-20)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.5 / 6.0 (was 0.4 / 8.0): RPP's collision check sees cost further off the walls.
        # Sim run 2026-11-16: with 0.4 / 8.0 the robot spent ~24 s within 3 cm of a wall at
        # the ramp corner and ended NO_EXIT ("Starting point in lethal space").
        inflation_radius: 0.5
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.6      # s; = local_costmap
      # Rolling, not sized by /map: the SLAM map ends at about the start pose (the lidar is
      # blind behind the robot), and Humble's Smac planner doesn't check that the start lies
      # in the costmap - planning from just off the map edge segfaulted planner_server (seen
      # live, run 2026-11-14 08:52) and the lifecycle manager then took all of Nav2 down.
      # A rolling window is always centred on the robot. The static layer still copies /map
      # in. The explorer only sends goals inside this window (goal_max_offset).
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.27, 0.23], [0.27, -0.23], [-0.37, -0.23], [-0.37, 0.23]]"   # 5 cm back of base_link centre
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        # maze_explorer's /maze/map: SLAM's /map with the confirmed curtains drawn free
        # (slam_toolbox keeps a curtain as a wall for good: wall_scan's dropped bins read
        # +inf, which it ignores). So the planner can plan through a curtain, e.g. from the
        # line right after crossing (sim 2026-11-20: "Starting point in lethal space") or
        # back the way it came. A curtain not walked through yet still blocks plans: wall_scan
        # keeps it in the obstacle layer until it is crossed (curtains.scan_curtains), and
        # curtain_detector walks the robot through. Same as /map when there is no curtain.
        map_topic: /maze/map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: walls
        walls:
          topic: /wall_scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: false
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.45     # see local_costmap: beams over close walls cleared them
          max_obstacle_height: 2.0
          expected_update_rate: 1.5   # s; = local_costmap
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wide and gentle, so the planner keeps to the corridor centre and swings wide of the
        # inner wall in turns: cost still ~100 (of 252) in the middle of a 0.9 m corridor,
        # rising towards the walls. With 0.4 / 8.0 the cost was 0 from 0.4 m off a wall,
        # and paths hugged the inside of corners. 0.7 / 3.5 (was 0.6 / 4.0, 2026-11-16): a bit
        # more again (~130 mid-corridor instead of ~118); with 0.6 / 4.0 the sim robot still
        # scraped the inner wall at the ramp corner.
        inflation_radius: 0.7
        cost_scaling_factor: 3.5
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0         # s of turn checked for collision (2.0 = ~46 deg ahead at
    #                                  0.4 rad/s: corridor turns aborted early, run 2026-11-19 12:13)
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1          # softer end of each turn (was 0.2)
    rotational_acc_lim: 0.5          # was 1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.5]   # team limits; cmd_vel_bridge clamps again
    min_velocity: [0.0, 0.0, -0.5]   # never backwards
    max_accel: [0.3, 0.0, 0.5]       # angular 0.5 rad/s^2: the gentle turn start (open loop;
    #                                  RPP max_angular_accel 2.0 so it doesn't stall)
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

# Nav2 (Humble) for maze_nav: navigate a 1 m grid maze on a growing SLAM map.
#
#   maze_explorer --NavigateToPose--> bt_navigator (maze_bt.xml)
#   planner_server (Smac 2D, plans through unknown)  -> path
#   controller_server (Regulated Pure Pursuit)       -> cmd_vel_nav
#   velocity_smoother                                -> nav_cmd_vel
#   cmd_vel_bridge (robot QoS, clamp, watchdog)      -> /cmd_vel
#
# Obstacles come only from /wall_scan (walls 0.30-0.43 m above the floor). Ramps, mats and
# stairs are below that band on purpose: the robot walks over them.
#
# Maze geometry (example maze.step): 1 m cells, 0.05 m walls -> ~0.90-0.95 m clear corridor,
# 0.87 m between the stair hand rails. Footprint 0.69 x 0.46 m (Lite3 0.64 m incl. moving
# feet, robot_info.md, plus 5 cm margin at the back; x -0.37..0.32) -> 0.22 m each side in a
# corridor. The rear corners are 0.44 m from base_link, just under the 0.45 m half width, so
# turning on the spot in a corridor cell centre fits with only ~1.5 cm to spare.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml and default_nav_through_poses_bt_xml are both set to
    # config/maze_bt.xml by the launch file. Humble always loads the through-poses tree too,
    # and its default one needs the BackUp server, which isn't started here.

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true            # frontier goals sit next to unknown space
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0    # stay in the corridor centre
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0  # slow turns on the spot count as no progress
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 6.28       # heading at a frontier doesn't matter
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.60
      use_velocity_scaled_lookahead_dist: false
      lookahead_time: 1.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true    # slow down in turns
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true    # quadruped: turn on the spot, then walk
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.32, 0.23], [0.32, -0.23], [-0.37, -0.23], [-0.37, 0.23]]"   # 5 cm extra at the back
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: walls
        walls:
          topic: /wall_scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: false          # no return = no information (blind sector behind)
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.32, 0.23], [0.32, -0.23], [-0.37, -0.23], [-0.37, 0.23]]"   # 5 cm extra at the back
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: walls
        walls:
          topic: /wall_scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: false
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.5]   # team limits; cmd_vel_bridge clamps again
    min_velocity: [0.0, 0.0, -0.5]   # never backwards
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

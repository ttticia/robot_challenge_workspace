maze_navigator:
  ros__parameters:
    use_sim_time: false
    localization_source: tf
    map_frame: map
    base_frame: base_link
    map_topic: /map
    imu_topic: /imu/data
    cloud_topic: /livox/points
    command_topic: /cmd_vel
    maximum_tilt_deg: 0.0
    max_traversable_height_m: 0.16
    forward_speed: 0.12
    reverse_speed: 0.12
    turn_speed: 0.3
    footprint_length: 0.64
    footprint_width: 0.46
    exit_radius: 0.9
    minimum_exit_travel: 3.0
    exit_hold_seconds: 2.0
    sensor_timeout: 0.6
    tf_timeout: 0.5
